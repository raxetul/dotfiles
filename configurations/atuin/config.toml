## atuin — encrypted, fuzzy shell history.
## Replaces the old zsh-histdb + HISTORY_IGNORE regex setup.
##
## POLICY: no atuin surface may HIDE history. Ctrl+R and the grey
## zsh-autosuggestions suggestion stay fully global across every
## session/tab/host. The up-arrow key is the one deliberate narrowing: it uses
## "session-preload" so this terminal's own commands rank first. Nothing is
## lost by that — whatever ↑ omits is still reachable from Ctrl+R, which is
## why the narrowing is allowed at all.

## Sync is off — atuin runs as a local-only store unless explicitly turned on.
auto_sync = false
update_check = false

## fzf-style ctrl-r search.
filter_mode = "global"
## Up-arrow: this terminal's own commands first, older history still present.
## "session-preload" (labelled SESSION+ in the TUI) is a FILTER, not a sort —
## atuin has no session-aware ordering at all (every ORDER BY is plain
## `timestamp DESC`; smart_sort and the frecency multipliers are
## session-agnostic), so a filter is the only way to give the current session
## priority. Its SQL is:
##     WHERE session = <this session> OR timestamp < <this session's start>
## Recency ordering then floats this terminal's commands to the top.
##
## THE TRADE-OFF, stated plainly: commands typed in OTHER sessions *after this
## one started* do not appear on ↑. That set grows with session age — measured
## 2026-08-24 on a 6-day-old session: 3394 commands across 22 sessions, ~30% of
## the DB. They remain one Ctrl+R away (filter_mode below is still "global"),
## which is the whole reason this narrowing is acceptable. If ↑ ever feels like
## it is missing things, set this back to "global".
##
## Plain "session" is still forbidden — it would hide ALL other history,
## including everything predating this session.
filter_mode_shell_up_key_binding = "session-preload"
## Workspace-scoped filtering (restrict to the current git repo tree) stays
## off — another way search could silently narrow below "global".
workspaces = false
style = "compact"

## ↑ key defaulted to the full alternate-screen TUI (inline_height_shell_up_key_binding
## default = 0); that screen handoff is what produced the visible delay under
## ghostty+herdr. Ctrl+R already used the inline mode (inline_height default = 40).
## Pin both explicitly to inline so the ↑ key skips the alternate-screen handoff too.
inline_height = 40
inline_height_shell_up_key_binding = 40

## history_filter — regex patterns excluded from recording.
## Leading-token guards catch the common shapes for secrets, plus the
## two noisiest commands (`ls`, `cat`) so they don't drown out signal.
history_filter = [
  "^aws ",
  "^secret",
  "^password",
  "^token",
  "^api[-_]?key",
  "^export .*(SECRET|TOKEN|API|KEY|PASSWORD|PASS)=",
  "^pass ",
  "^cat ",
  "^ls$",
  "^ls .*"
]
search_mode = "daemon-fuzzy"

[search]
## Cycle-able filter modes, in priority order. "global" stays first so Ctrl+R
## opens on it; "session-preload" is listed so the cycle key can toggle to the
## ↑-key scope and back. Note filter_mode_shell_up_key_binding is NOT gated by
## this list (interactive.rs reads it directly) — the list only controls what
## the cycle key can reach. "session", "directory", "host" and "workspace" stay
## out: each hides history with no way back to it from another surface.
filters = ["global", "session-preload"]

[daemon]
enabled = true
autostart = true
