# Catppuccin Mocha colors for eza. Consumed by home/modules/eza.nix via the
# EZA_COLORS env var; eza picks up the variable on every invocation.
#
# Reference for the EZA_COLORS DSL: https://github.com/eza-community/eza/blob/main/man/eza_colors.5.md
#
# Color keys (subset; see man eza_colors for the full list):
#   uu/un  — user owner names
#   gu/gn  — group owner names
#   da     — date
#   sb     — file size
#   di     — directories
#   ex     — executables
#   ln     — symlinks
#   xx     — punctuation
EZA_COLORS: |
  uu=38;2;205;214;244:gu=38;2;205;214;244:
  da=38;2;180;190;254:
  sb=38;2;249;226;175:sn=38;2;205;214;244:
  di=38;2;137;180;250;1:ex=38;2;166;227;161;1:
  ln=38;2;245;194;231:lc=38;2;245;194;231:
  pi=38;2;249;226;175:so=38;2;249;226;175:
  bd=38;2;243;139;168:cd=38;2;243;139;168:
  or=38;2;243;139;168;1:
  xx=38;2;127;132;156
