# lefthook.yml — repository-level pre-commit and commit-msg checks for
# this dotfiles repo. Installed by `lefthook install`, run automatically
# at the end of setup.sh.
#
# Bypass everything: `LEFTHOOK=0 git commit ...` (don't make a habit of it).

commit-msg:
  commands:
    conventional-commits:
      run: |
        PATTERN='^(feat|fix|refactor|chore|docs|style|perf|build|ci|test|revert)(\([a-z0-9_/.-]+\))?!?: .+'
        first_line="$(grep -v '^#' {1} | head -n1)"
        if ! printf '%s' "${first_line}" | grep -qE "${PATTERN}"; then
          echo "ERROR: not a Conventional Commit: ${first_line}" >&2
          echo "Format: type(scope): subject" >&2
          exit 1
        fi

pre-commit:
  parallel: true
  commands:
    # Covers EXTENSIONLESS scripts too (scripts/leak-guard, agent-skills,
    # claude-worktree, herdr-team, update-dotfiles, init-load, ...), which the
    # old scripts/*.sh glob silently skipped. Selection is by SHEBANG rather
    # than by name, because shellcheck only supports sh/bash/dash/ksh and
    # errors out on anything else (SC1071) — scripts/dc-image-update is zsh.
    # A future zsh/python/fish script therefore drops out on its own instead of
    # breaking every commit.
    shellcheck:
      glob: "{scripts/*,setup.sh,configurations/claude/hooks/*.sh,configurations/claude/hooks/tests/*.sh}"
      run: |
        checkable=""
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          shebang="$(head -n1 "$f")"
          case "$shebang" in
            *zsh*|*fish*|*python*|*node*|*perl*|*ruby*) continue ;;
            \#!*sh*|\#!*ksh*) checkable="$checkable $f" ;;
            *) continue ;;
          esac
        done
        [ -n "$checkable" ] || exit 0
        # shellcheck disable=SC2086  # intentional word splitting of the list
        shellcheck $checkable
    leak-guard:
      run: scripts/leak-guard scan --mode staged
