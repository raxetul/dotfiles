# =============================================================================
# tmux.conf — sourced by the HM-generated config (see home/modules/tmux.nix).
# Plugins are wired up declaratively via programs.tmux.plugins; this file
# carries everything else: prefix, mouse, splits, navigation, theme tuning.
# =============================================================================

# ----- prefix ---------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----- truecolor / 256 colors ----------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# ----- general --------------------------------------------------------------
set -g mouse on
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -sg escape-time 10

# ----- splits inherit CWD ---------------------------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# ----- vim-style pane navigation -------------------------------------------
# Smart pane switching when running inside vim/neovim, via vim-tmux-navigator.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ----- copy mode (vi keys) --------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ----- mouse wheel scrolling ------------------------------------------------
# Wheel over a mouse-aware full-screen app (Claude Code, vim, less, htop)
# forwards the event so the app scrolls its own view; otherwise drop into
# copy-mode and scroll the pane scrollback, auto-exiting at the bottom (`-e`).
# Once in copy-mode, WheelDown is handled by the copy-mode-vi defaults.
# NB: only fires when the client actually emits wheel events — some mobile/web
# SSH clients don't, so there use keyboard copy-mode (`C-a [`, then vi keys).
bind -n WheelUpPane \
    if-shell -F "#{mouse_any_flag}" \
        "send-keys -M" \
        "if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# ----- reload --------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ----- catppuccin tmux plugin tuning ---------------------------------------
# Plugin itself is loaded by programs.tmux.plugins; the flavour selector
# must be set BEFORE the plugin runs, which HM handles via the per-plugin
# `extraConfig`. Status-bar layout tweaks belong here.
set -g status-position top
set -g status-interval 5
