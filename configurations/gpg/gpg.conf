# gpg.conf — modern crypto defaults. Symlinked to ~/.gnupg/gpg.conf
# by scripts/symlinks.sh. Mirrors what `programs.gpg.settings = {…}`
# was generating under Home Manager in home/modules/gpg.nix.

# No "Welcome" banner; long key-IDs everywhere; fingerprints in listings
# so scripts/gpg-setup.sh can grep them out reliably.
no-greeting
keyid-format long
with-fingerprint
use-agent

# Modern crypto preferences for all newly-generated keys.
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256

charset utf-8
